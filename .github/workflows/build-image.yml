name: Build container image

# Builds the deployment image and publishes it to GitHub Container Registry.
#
# GHCR rather than Azure Container Registry for two reasons: it is free for public images, and
# `az acr build` is refused outright on an Azure for Students subscription
# (TasksOperationsNotAllowed), so there is no remote build service available there anyway.
#
# The runner is pinned to ubuntu-24.04 to match ci.yml, and for the same reason: quantcrypt
# publishes only manylinux_2_39 wheels, which need glibc >= 2.39.

on:
  push:
    branches: ["**"]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "qvault/**"
      - "witness/**"
      - "wsgi.py"
      - "config.py"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        id: image
        # GHCR rejects uppercase in a repository path; this repo's name has capitals.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report
        run: |
          echo "Pushed ${{ steps.image.outputs.name }}:latest"
          echo "The Dockerfile self-checks ML-DSA sign+verify during the build, so a green run"
          echo "means the PQC backend loaded on the target platform — not merely that pip ran."
