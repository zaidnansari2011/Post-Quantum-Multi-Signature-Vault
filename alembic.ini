# Alembic: schema migrations for Q-Vault (plan S8). How to use it, and why an existing database is
# stamped rather than upgraded: docs/runbooks/database-migrations.md.
#
# Which database a command acts on is decided in migrations/env.py, in this order:
#   1. -x url=...  on the command line;
#   2. DATABASE_URL, read the way config.py reads it (.env included), as the app does;
#   3. sqlalchemy.url below, if you set one;
#   4. the app's own default, sqlite:///qvault.db in the instance/ folder.

[alembic]
script_location = %(here)s/migrations

# The file is named after the revision id, and revision ids are "NNNN_slug", given explicitly:
#   alembic revision --autogenerate --rev-id 0002_workspaces -m "Workspaces"
file_template = %%(rev)s

# The repository root, so env.py can import qvault and config wherever alembic is run from.
prepend_sys_path = %(here)s
path_separator = os

# Unset on purpose: DATABASE_URL (or the app's default) is the source of truth, as for the app.
# sqlalchemy.url =

# The output encoding used when revision files are written from script.py.mako.
output_encoding = utf-8


[post_write_hooks]
# New revision files are made to pass CI's `black --check .` and `ruff check .` as they are written.
# black first, so ruff judges the wrapped lines; a line black cannot wrap is ruff's to report.
hooks = black, ruff
black.type = module
black.module = black
black.options = REVISION_SCRIPT_FILENAME
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
