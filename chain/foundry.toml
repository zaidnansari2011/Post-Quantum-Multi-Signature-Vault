# Q-Vault treasury contracts. See docs/plans/onchain-execution.md.
#
# Compiler settings are ZKNox's for the ML-DSA-65 verifier, deliberately unchanged: its measured
# 1.54M gas per verification and its 24,272-byte runtime (EIP-170 allows 24,576) were produced
# with exactly these settings. Lowering optimizer_runs or leaving the IR pipeline makes the
# verifier both more expensive and, at some point, too large to deploy.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "osaka"
via_ir = true
optimizer = true
optimizer_runs = 1000000
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "ETHDILITHIUM/=lib/ETHDILITHIUM/src/",
  # ETHDILITHIUM's own imports, resolved inside its pinned submodules.
  "sstore2/=lib/ETHDILITHIUM/lib/sstore2/contracts/",
  "InterfaceVerifier/=lib/ETHDILITHIUM/lib/InterfaceVerifier/src/",
]
# Read-only. Nothing run by forge records deployments: see script/DeployVerifier.s.sol.
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./lib/ETHDILITHIUM/test/f1600_170.hex" },
]

[fuzz]
runs = 64  # every run verifies ML-DSA signatures; 64 keeps the suite under a minute
