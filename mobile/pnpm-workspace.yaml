# pnpm 10+ reads settings from HERE, not from .npmrc. `node-linker=hoisted` in .npmrc is silently
# ignored by pnpm 11 (`pnpm config get node-linker` -> undefined), which meant the layout every test
# ran against -- flat, because the flag was passed by hand -- was NOT the layout a clean clone or an
# EAS build would produce. Declaring it here makes `pnpm install` reproduce it with no flag.
#
# Hoisted rather than the default isolated store: Metro resolves pnpm's symlinked layout
# inconsistently, and a bundler that cannot find a module fails at build time with a path, not a
# cause.
nodeLinker: hoisted

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.17'
  - '@expo/fingerprint@0.20.9'
  - '@expo/local-build-cache-provider@57.0.7'
  - '@expo/metro-config@57.0.9'
  - '@expo/prebuild-config@57.0.13'
  - '@expo/router-server@57.0.7'
  - expo-asset@57.0.13
  - expo-constants@57.0.13
  - expo-file-system@57.0.5
  - expo-modules-core@57.0.12
  - expo-modules-jsi@57.0.5
  - expo@57.0.15
  - expo-updates@57.0.16
