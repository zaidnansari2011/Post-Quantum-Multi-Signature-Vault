<!--
  Phone additions to the style tile's icon sprite (phone-ux §2.2), drawn in the tile's grammar:
  a 16-unit grid, one 1.5 stroke, round caps and joins, currentColor.

  These belong in the tile's sprite as well, so the web draws the same glyphs; they are kept here
  until the next tile revision so this stream does not edit web files other streams are changing.

  Paint, for tools/icons_from_tile.ts:
    (no attribute)                       stroke, 1.5 (or data-stroke="w")
    fill="currentColor" stroke="none"    fill only, as the tile writes its dots
    data-paint="fill"                    fill only
    data-paint="knockout"                a hole cut out of the fill underneath it (simple shapes)

  The four -fill glyphs are the active tab icons (the HIG asks for filled active tab icons).
-->
