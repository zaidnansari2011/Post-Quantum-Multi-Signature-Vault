<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Q-Vault{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --qv-accent: #3538CD; }
    body { background: #f6f7f9; }
    .navbar-brand { font-weight: 700; letter-spacing: .3px; }
    .algo-chip { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    footer { color: #6c757d; font-size: .85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg" style="background: var(--qv-accent);" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand text-white" href="/">🔐 Q-Vault</a>
      <span class="navbar-text text-white-50">Post-Quantum Multi-Signature Vault</span>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="container py-4 border-top mt-4">
    Reference / educational system — not production-audited. &middot; Q-Vault v{{ version|default('0.1.0') }}
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
